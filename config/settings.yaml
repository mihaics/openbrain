database:
  host: localhost
  port: 5433
  name: openbrain
  user: openbrain
  password: openbrain_local

embedder:
  provider: ollama
  model: qwen3-embedding:0.6b
  dimensions: 1024

mcp:
  host: 0.0.0.0
  port: 8080

api:
  host: 0.0.0.0
  port: 8000
  cors_origins:
    - "*"

web:
  port: 3777

tags:
  deny_list:
    - password
    - secret
    - api_key
    - token
    - credential
  # Deliberately empty: a tag applied to everything conveys nothing.
  default_tags: []

ranking:
  # Secondary signals break near-ties; they must not override relevance.
  # w_rec + w_imp + w_acc is capped at 0.10 and validated at startup.
  w_rec: 0.05
  w_imp: 0.03
  w_acc: 0.02
  half_life_days: 180
  access_cap: 10
  access_tracking:
    enabled: true
  rerank:
    enabled: false
    url: ""
    model: ""
    top_n: 50
    timeout_seconds: 5

capture:
  # Auto-capture is opt-in twice: globally, and per project. Entries are
  # absolute paths covering their whole subtree, so one entry per work tree
  # admits every repository under it, present and future.
  # Disabled 2026-08-12: an audit of 30 real transcripts kept 1 of 10 extracted
  # facts. Re-enable once extraction meets the bar, not before.
  enabled: false
  projects:
    - /home/mihai/work/quarticle
    - /home/mihai/work/pactos
    - /home/mihai/work/sysop
    # Not under ~/work, so it stays listed in its own right.
    - /home/mihai/tools/open-brain
  model: qwen3:4b
  model_digest: "359d7dd4bcdab3d8"
  prompt_version: "1"
  ollama_url: http://127.0.0.1:11434
  num_ctx: 16384
  timeout_seconds: 120
  max_facts_per_boundary: 3
  max_fact_chars: 1000
  max_input_tokens: 12000
  max_sessions_per_drain: 20
  daily_ceiling: 30
  dedup_threshold: 0.92

analytics:
  trend_weeks: 4
  weekly_report_day: 6

security:
  mode: direct
