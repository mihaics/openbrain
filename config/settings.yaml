database:
  host: localhost
  port: 5433
  name: openbrain
  user: openbrain
  password: openbrain_local

embedder:
  provider: ollama
  model: qwen3-embedding:0.6b
  dimensions: 1024

mcp:
  host: 0.0.0.0
  port: 8080

api:
  host: 0.0.0.0
  port: 8000
  cors_origins:
    - "*"

web:
  port: 3777

tags:
  deny_list:
    - password
    - secret
    - api_key
    - token
    - credential
  # Deliberately empty: a tag applied to everything conveys nothing.
  default_tags: []

ranking:
  # Secondary signals break near-ties; they must not override relevance.
  # w_rec + w_imp + w_acc is capped at 0.10 and validated at startup.
  w_rec: 0.05
  w_imp: 0.03
  w_acc: 0.02
  half_life_days: 180
  access_cap: 10
  access_tracking:
    enabled: true
  rerank:
    enabled: false
    url: ""
    model: ""
    top_n: 50
    timeout_seconds: 5

analytics:
  trend_weeks: 4
  weekly_report_day: 6

security:
  mode: direct
