# Create the log directory before any unit starts.
#
# openbrain-backup.service redirects stdout to a file in here. systemd opens
# that file *before* it creates StateDirectory=, so the unit cannot bootstrap
# its own log target: on a machine where the directory is missing, the unit
# fails with status 209 (EXIT_STDOUT) and the nightly backup silently never
# runs. systemd-tmpfiles-setup runs early in the user session, before units,
# so this closes that hole.
d %S/openbrain 0700 - - -
